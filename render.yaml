services:
  - type: web
    name: sharp-fitness
    runtime: docker
    plan: free
    autoDeploy: true
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: sharp-fitness-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: TRAINER_EMAIL
        value: codysharp011@outlook.com
      - key: TRAINER_FIRST_NAME
        value: Cody
      - key: TRAINER_LAST_NAME
        value: Sharp
      - key: TRAINER_PASSWORD
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: S3_BUCKET
        sync: false
      - key: S3_REGION
        sync: false
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM
        sync: false
      - key: CONTACT_NOTIFICATION_TO
        value: codysharp011@outlook.com

databases:
  - name: sharp-fitness-db
    plan: free
